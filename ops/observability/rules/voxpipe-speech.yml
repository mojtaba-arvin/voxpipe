groups:
  - name: voxpipe-speech
    rules:
      - alert: VoxPipeSpeechTelemetryTargetDown
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels:
          severity: critical
          service: voxpipe
        annotations:
          summary: "VoxPipe telemetry Collector scrape target is down"
          description: "Prometheus cannot scrape the Collector metrics endpoint. Check Collector health, network policy, and receiver/exporter logs."

      - alert: VoxPipeSpeechFailureRatioHigh
        expr: |
          (
            sum(rate(voxpipe_stt_operations_total{outcome="failed"}[5m]))
            /
            clamp_min(sum(rate(voxpipe_stt_operations_total{outcome=~"succeeded|failed"}[5m])), 1e-9)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          service: voxpipe
        annotations:
          summary: "VoxPipe speech failure ratio is above 5%"
          description: "Inspect provider availability, bounded error_code dimensions, and the speech reliability runbook. Confirm adequate request volume before mitigation."

      - alert: VoxPipeSpeechLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(voxpipe_stt_duration_milliseconds_bucket[10m]))
          ) > 10000
        for: 10m
        labels:
          severity: warning
          service: voxpipe
        annotations:
          summary: "VoxPipe speech p95 duration exceeds 10 seconds"
          description: "Inspect provider latency, queueing, and worker saturation. The 10-second threshold is an initial operational trigger, not an approved SLO."
