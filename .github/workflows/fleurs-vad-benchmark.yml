name: FLEURS VAD envelope benchmark

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_fleurs_vad_benchmark.py"
      - "src/voxpipe/speech/vad.py"
      - "requirements-vad.txt"
      - ".github/workflows/fleurs-vad-benchmark.yml"
  workflow_dispatch:

concurrency:
  # Each benchmark owns its concurrency group; unrelated workstreams never cancel one another.
  group: voxpipe-vad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vad:
    name: Silero and WebRTC VAD on pinned FLEURS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Install CPU-only PyTorch runtime
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
      - name: Install VAD benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-vad.txt
      - name: Run VAD envelope benchmark
        run: python scripts/run_fleurs_vad_benchmark.py --max-samples 20 --output-dir benchmark-results/fleurs-vad
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fleurs-vad-envelope-benchmark
          path: benchmark-results/fleurs-vad/
          if-no-files-found: warn
          retention-days: 30
