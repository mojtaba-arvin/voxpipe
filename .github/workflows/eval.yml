name: Evaluation baseline

on:
  workflow_dispatch:
    inputs:
      run_eval_32:
        description: "Run Group A structured extraction evaluation"
        required: false
        type: boolean
        default: true
      run_eval_48:
        description: "Run Group B retrieval evaluation"
        required: false
        type: boolean
        default: true
      run_eval_47:
        description: "Run Group C speech evaluation"
        required: false
        type: boolean
        default: true
      corpus_path:
        description: "Optional workspace-relative JSONL corpus path for Group B"
        required: false
        type: string
      comment_issue:
        description: "Optional issue number for a one-off disclosure comment"
        required: false
        type: string
      comment_body:
        description: "Comment body; used only when comment_issue is provided"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: evaluation-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval-32:
    name: Group A — structured extraction (silver)
    if: \${{ inputs.run_eval_32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluation implementation pending
        run: echo "Group A implementation is tracked by issues 168 through 171."

  eval-48:
    name: Group B — retrieval (silver)
    if: \${{ inputs.run_eval_48 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORPUS_PATH: \${{ inputs.corpus_path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Install evaluation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Generate deterministic retrieval queries
        run: python -m eval.issue48.queries --count 120 --seed 20261125
      - name: Build heuristic silver qrels
        run: python -m eval.issue48.qrels
      - name: Run deterministic lexical-only baseline
        run: python -m eval.issue48.lexical_baseline
      - name: Compute and validate retrieval metrics
        run: python -m eval.issue48.metrics
      - name: Upload retrieval evaluation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retrieval-silver-baseline
          path: eval/artifacts/issue48/
          if-no-files-found: error
      - name: Disclose retrieval silver baseline on issue 48
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          ISSUE_NUMBER: "48"
        run: |
          COMMENT_BODY="$(python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("eval/artifacts/issue48/metrics_48.json").read_text(encoding="utf-8"))
          lines = [
              "## Automated retrieval evaluation — silver baseline",
              "",
              f"- Queries: {result['query_count']} (test: {result['test_query_count']})",
              f"- Corpus passages: {result['corpus_count']}",
              f"- Seed: {result['seed']}",
              f"- Split counts: {result['split_counts']}",
              f"- Jaccard qrels threshold: {result['jaccard_threshold']}",
              f"- Recall@5: {result['recall_at_5']:.4f}",
              f"- MRR: {result['mrr']:.4f}",
              f"- nDCG@5: {result['ndcg_at_5']:.4f}",
              "",
              "Qrels are heuristic lexical silver labels (source passage=2, Jaccard overlap >= threshold=1), not human relevance judgments.",
              "The ranking method is a deterministic lexical-only baseline, not the production hybrid/semantic retrieval service.",
              "The five-passage placeholder saturates Recall@5; these results validate pipeline wiring only and are not production Persian search-quality evidence.",
              "No paid inference API or real customer data is used.",
          ]
          print("\n".join(lines))
          PY
          )"
          export COMMENT_BODY
          bash scripts/comment_issue.sh

  eval-47:
    name: Group C — speech (silver)
    if: \${{ inputs.run_eval_47 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluation implementation pending
        run: echo "Group C implementation is tracked by issues 176 through 180."

  post-results:
    name: Aggregate evaluation outcomes
    if: \${{ always() }}
    needs: [eval-32, eval-48, eval-47]
    runs-on: ubuntu-latest
    steps:
      - name: Publish truthful group status summary
        env:
          GROUP_A: \${{ needs['eval-32'].result }}
          GROUP_B: \${{ needs['eval-48'].result }}
          GROUP_C: \${{ needs['eval-47'].result }}
        run: |
          {
            echo "## VoxPipe silver evaluation baseline"
            echo
            echo "| Group | Result |"
            echo "|---|---|"
            echo "| Extraction (#32) | \${GROUP_A} |"
            echo "| Retrieval (#48) | \${GROUP_B} |"
            echo "| Speech (#47) | \${GROUP_C} |"
            echo
            echo "These are automated silver-baseline results, not human gold or production-quality claims."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post optional disclosure comment
        if: \${{ inputs.comment_issue != '' && inputs.comment_body != '' }}
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          ISSUE_NUMBER: \${{ inputs.comment_issue }}
          COMMENT_BODY: \${{ inputs.comment_body }}
        run: bash scripts/comment_issue.sh
