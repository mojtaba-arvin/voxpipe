name: Evaluation baseline

on:
  workflow_call:
    inputs:
      run_eval_32:
        required: false
        type: boolean
        default: false
      run_eval_48:
        required: false
        type: boolean
        default: false
      run_eval_47:
        required: false
        type: boolean
        default: false
      run_tts_overlap:
        required: false
        type: boolean
        default: false
      corpus_path:
        required: false
        type: string
        default: ""
      comment_issue:
        required: false
        type: string
        default: ""
      comment_body:
        required: false
        type: string
        default: ""
      run_common_voice_asr:
        required: false
        type: boolean
        default: false
    secrets:
      MDC_API_KEY:
        required: false

  workflow_dispatch:
    inputs:
      run_eval_32:
        description: "Run Group A structured extraction evaluation"
        required: false
        type: boolean
        default: true
      run_eval_48:
        description: "Run Group B retrieval evaluation"
        required: false
        type: boolean
        default: true
      run_eval_47:
        description: "Run Qwen3-ASR CPU feasibility smoke (not the Group C aggregate)"
        required: false
        type: boolean
        default: true
      run_tts_overlap:
        description: "Run synthetic Persian TTS overlap fixtures"
        required: false
        type: boolean
        default: true
      run_common_voice_asr:
        description: "Run bounded Persian Common Voice ASR (requires MDC access)"
        required: false
        type: boolean
        default: false
      corpus_path:
        description: "Optional workspace-relative JSONL corpus path for Group B"
        required: false
        type: string
      comment_issue:
        description: "Optional issue number for a one-off disclosure comment"
        required: false
        type: string
      comment_body:
        description: "Comment body; used only when comment_issue is provided"
        required: false
        type: string

  pull_request:
    paths:
      - "eval/issue47/synthetic_overlap.py"
      - "eval/issue47/overlap_manifest.schema.json"
      - "eval/issue47/overlap_annotation.schema.json"
      - "requirements-eval-tts.txt"
      - "tests/test_eval_synthetic_overlap.py"
      - "eval/issue32/templates.py"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval-32:
    name: Group A — structured extraction (silver)
    if: ${{ inputs.run_eval_32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install evaluation dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Generate deterministic synthetic conversations
        run: python -m eval.issue32.templates --count 120 --seed 20261125
      - name: Create deterministic silver labels
        run: python -m eval.issue32.rules
      - name: Compute and validate extraction metrics
        run: python -m eval.issue32.metrics
      - name: Upload extraction evaluation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: extraction-silver-baseline
          path: eval/artifacts/issue32/
          if-no-files-found: error
      - name: Disclose extraction silver baseline on issue 32
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "32"
        run: |
          COMMENT_BODY="$(python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("eval/artifacts/issue32/metrics_32.json").read_text(encoding="utf-8"))
          lines = [
              "## Automated extraction evaluation — silver baseline",
              "",
              f"- Conversations: {result['dataset_count']}",
              f"- Seed: {result['seed']}",
              f"- Split counts: {result['split_counts']}",
              f"- Overall micro F1: {result['overall_micro']['f1']:.4f}",
              f"- Overall macro F1: {result['overall_macro']['f1']:.4f}",
              "",
              "| Field | Precision | Recall | F1 |",
              "|---|---:|---:|---:|",
          ]
          for field, metrics in result["fields"].items():
              lines.append(f"| {field} | {metrics['precision']:.4f} | {metrics['recall']:.4f} | {metrics['f1']:.4f} |")
          lines.extend([
              "",
              "This is a deterministic **silver** baseline using generated Persian templates and rule-based labels.",
              "The reference slots are template-generated, not human-reviewed; this is not a human gold set, production accuracy claim, natural-conversation evaluation, or medical-readiness claim.",
              "No real customer data or paid inference API is used.",
          ])
          print("\n".join(lines))
          PY
          )"
          export COMMENT_BODY
          bash scripts/comment_issue.sh

  eval-48:
    name: Group B — retrieval (silver)
    if: ${{ inputs.run_eval_48 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORPUS_PATH: ${{ inputs.corpus_path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install evaluation dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Generate deterministic retrieval queries
        run: python -m eval.issue48.queries --count 120 --seed 20261125
      - name: Build heuristic silver qrels
        run: python -m eval.issue48.qrels
      - name: Run deterministic lexical-only baseline
        run: python -m eval.issue48.lexical_baseline
      - name: Compute and validate retrieval metrics
        run: python -m eval.issue48.metrics
      - name: Upload retrieval evaluation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retrieval-silver-baseline
          path: eval/artifacts/issue48/
          if-no-files-found: error
      - name: Disclose retrieval silver baseline on issue 48
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "48"
        run: |
          COMMENT_BODY="$(python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("eval/artifacts/issue48/metrics_48.json").read_text(encoding="utf-8"))
          lines = [
              "## Automated retrieval evaluation — silver baseline",
              "",
              f"- Queries: {result['query_count']} (test: {result['test_query_count']})",
              f"- Corpus passages: {result['corpus_count']}",
              f"- Seed: {result['seed']}",
              f"- Split counts: {result['split_counts']}",
              f"- Jaccard qrels threshold: {result['jaccard_threshold']}",
              f"- Recall@5: {result['recall_at_5']:.4f}",
              f"- MRR: {result['mrr']:.4f}",
              f"- nDCG@5: {result['ndcg_at_5']:.4f}",
              "",
              "Qrels are heuristic lexical silver labels (source passage=2, Jaccard overlap >= threshold=1), not human relevance judgments.",
              "The ranking method is a deterministic lexical-only baseline, not the production hybrid/semantic retrieval service.",
              "The five-passage placeholder saturates Recall@5; these results validate pipeline wiring only and are not production Persian search-quality evidence.",
              "No paid inference API or real customer data is used.",
          ]
          print("\n".join(lines))
          PY
          )"
          export COMMENT_BODY
          bash scripts/comment_issue.sh

  qwen-cpu-smoke:
    name: Qwen3-ASR CPU feasibility smoke (feasibility only)
    if: ${{ inputs.run_eval_47 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Cache pinned Qwen3-ASR model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/huggingface
          key: voxpipe-qwen3-asr-model-v2
      - name: Install pinned CPU-only PyTorch wheel from the official index
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.15.0+cpu
      - name: Install patched native Transformers and audio dependencies
        run: uv pip install --system -r requirements-eval-asr.txt
      - name: Run pinned Qwen3-ASR CPU smoke
        run: python -m eval.issue47.cpu_smoke
      - name: Upload CPU smoke metadata only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qwen3-asr-cpu-smoke
          path: eval/artifacts/issue47/cpu_smoke.json
          if-no-files-found: error
      - name: Disclose CPU feasibility results on issue 166
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "166"
        run: |
          COMMENT_BODY="$(python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("eval/artifacts/issue47/cpu_smoke.json").read_text(encoding="utf-8"))
          lines = [
              "## Qwen3-ASR CPU feasibility smoke",
              "",
              f"- Model revision: {result['model_revision']}",
              f"- Model size: {result['model_size_bytes']} bytes",
              f"- Peak RSS: {result['peak_rss_bytes'] / (1024 ** 2):.1f} MiB",
              f"- Download time: {result['model_download_seconds']:.2f}s",
              f"- Load time: {result['model_load_seconds']:.2f}s",
              f"- Audio duration: {result['audio_duration_seconds']:.2f}s",
              f"- Inference time: {result['inference_seconds']:.2f}s",
              f"- Real-time factor: {result['real_time_factor']:.4f}",
              f"- CPU cores / Torch threads: {result['cpu_count']} / {result['torch_num_threads']}",
              "",
              "This uses the publisher's English sample to measure CPU feasibility only. It is not Persian WER or production-quality evidence; no transcript text, audio or timestamps are uploaded.",
          ]
          print("\n".join(lines))
          PY
          )"
          export COMMENT_BODY
          bash scripts/comment_issue.sh


  common-voice-asr:
    name: Group C — Persian Common Voice ASR (read-speech)
    if: ${{ inputs.run_common_voice_asr }}
    uses: ./.github/workflows/common-voice-asr.yml
    secrets:
      MDC_API_KEY: ${{ secrets.MDC_API_KEY }}

  tts-overlap:
    name: Synthetic Persian TTS overlap fixtures
    if: ${{ inputs.run_tts_overlap || (github.event_name == 'pull_request' && github.workflow == 'Evaluation baseline') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install local TTS evaluation dependencies
        run: uv pip install --system -r requirements-eval-tts.txt
      - name: Generate 50 Persian synthetic overlap fixtures
        run: python -m eval.issue47.synthetic_overlap --count 50 --seed 20261125
      - name: Upload audio-free overlap annotations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-overlap-annotations
          path: |
            eval/artifacts/issue47/overlap_annotations.jsonl
            eval/artifacts/issue47/overlap_manifest.json
          if-no-files-found: error
      - name: Disclose synthetic overlap results on issue 179
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "179"
        run: |
          COMMENT_BODY="$(python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("eval/artifacts/issue47/overlap_manifest.json").read_text(encoding="utf-8"))
          lines = [
              "## Synthetic Persian TTS overlap fixtures",
              "",
              f"- Conversations / overlaps: {result['conversation_count']} / {result['overlap_count']}",
              f"- TTS runtime: {result['tts_runtime']} {result['tts_runtime_version']}",
              f"- Voice variants: {result['voice_models']}",
              f"- Mean overlap: {result['mean_overlap_seconds']:.3f}s",
              f"- Leading pause / background noise SNR: {result['leading_silence_seconds']:.2f}s / {result['background_noise_snr_db']:.1f} dB",
              f"- Mixed audio generated: {result['audio_files_generated']} temporary files",
              "",
              "Only synthetic timing annotations and aggregate metadata are uploaded. WAVs and transcript text are not persisted.",
              "This validates synthetic overlap plumbing only; it is not natural-speech or distinct-speaker diarization evidence.",
          ]
          print("\n".join(lines))
          PY
          )"
          export COMMENT_BODY
          bash scripts/comment_issue.sh

  eval-47:
    name: Group C — speech evidence aggregate
    if: ${{ always() }}
    needs: [common-voice-asr, tts-overlap]
    runs-on: ubuntu-latest
    outputs:
      group_status: ${{ steps.aggregate.outputs.group_status }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install report validation dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Download Persian read-speech aggregate
        if: ${{ needs.common-voice-asr.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: persian-read-speech-evaluation
          path: eval/artifacts/downloaded/read-speech
      - name: Download synthetic overlap annotations
        if: ${{ needs.tts-overlap.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: synthetic-overlap-annotations
          path: eval/artifacts/downloaded/synthetic-overlap
      - name: Aggregate read-speech and synthetic branches
        id: aggregate
        if: ${{ always() }}
        env:
          READ_SPEECH_STATUS: ${{ needs.common-voice-asr.result }}
          SYNTHETIC_STATUS: ${{ needs.tts-overlap.result }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m eval.issue47.aggregate_speech \
            --read-speech-status "$READ_SPEECH_STATUS" \
            --synthetic-status "$SYNTHETIC_STATUS" \
            --read-speech-dir eval/artifacts/downloaded/read-speech \
            --synthetic-dir eval/artifacts/downloaded/synthetic-overlap \
            --run-id "$RUN_ID" \
            --commit-sha "$COMMIT_SHA" \
            --run-url "$RUN_URL"
      - name: Disclose Group C branch outcomes on issue 47
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "47"
        run: |
          COMMENT_BODY="$(cat eval/artifacts/issue47/report_47.md)"
          export COMMENT_BODY
          bash scripts/comment_issue.sh
      - name: Upload Group C aggregate report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: speech-evaluation-group
          path: |
            eval/artifacts/issue47/report_47.json
            eval/artifacts/issue47/report_47.md
          if-no-files-found: error

  post-results:
    name: Aggregate all silver evaluation groups
    if: ${{ always() }}
    needs: [eval-32, eval-48, qwen-cpu-smoke, eval-47, common-voice-asr, tts-overlap]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install summary validation dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Download extraction silver artifact
        if: ${{ needs['eval-32'].result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: extraction-silver-baseline
          path: eval/artifacts/downloaded/issue32
      - name: Download retrieval silver artifact
        if: ${{ needs['eval-48'].result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: retrieval-silver-baseline
          path: eval/artifacts/downloaded/issue48
      - name: Download speech group artifact
        if: ${{ needs['eval-47'].result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: speech-evaluation-group
          path: eval/artifacts/downloaded/issue47
      - name: Build exact-provenance summary
        id: aggregate
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m eval.post_results \
            --extraction-status "${{ needs['eval-32'].result }}" \
            --retrieval-status "${{ needs['eval-48'].result }}" \
            --speech-status "${{ needs['eval-47'].outputs.group_status || needs['eval-47'].result }}" \
            --extraction-dir eval/artifacts/downloaded/issue32 \
            --retrieval-dir eval/artifacts/downloaded/issue48 \
            --speech-dir eval/artifacts/downloaded/issue47 \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Post truthful summaries to all umbrella issues
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for issue in 32 47 48; do
            COMMENT_BODY="$(cat "eval/artifacts/post-results/issue-${issue}.md")"
            export ISSUE_NUMBER="$issue" COMMENT_BODY
            bash scripts/comment_issue.sh
          done
      - name: Reconcile silver completion labels
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALL_SUCCESS: ${{ steps.aggregate.outputs.all_success }}
        run: |
          set -euo pipefail
          if [[ "$ALL_SUCCESS" == "true" ]]; then
            gh label create silver-baseline-complete \
              --repo "$GITHUB_REPOSITORY" \
              --color "0E8A16" \
              --description "All three automated silver evaluation groups passed with validated artifacts" \
              --force
            for issue in 32 47 48; do
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label silver-baseline-complete
            done
          else
            for issue in 32 47 48; do
              present="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | index("silver-baseline-complete") != null')"
              if [[ "$present" == "true" ]]; then
                gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --remove-label silver-baseline-complete
              fi
            done
          fi
      - name: Publish final run summary
        if: ${{ always() }}
        run: |
          echo "## VoxPipe silver evaluation"
          echo
          cat eval/artifacts/post-results/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload final summary and issue disclosures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: silver-evaluation-summary
          path: eval/artifacts/post-results/
          if-no-files-found: error
