
name: Local Ollama structured extraction smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_ollama_structured_smoke.py"
      - "src/voxpipe/structuring/**"
      - "contracts/schemas/structured-intelligence.v1.schema.json"
      - ".github/workflows/ollama-structured-smoke.yml"
  push:
    branches: [feat/phase2-6-execution-foundation]
    paths:
      - "scripts/run_ollama_structured_smoke.py"
      - "src/voxpipe/structuring/**"
      - "contracts/schemas/structured-intelligence.v1.schema.json"
      - ".github/workflows/ollama-structured-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-llm:
    name: Qwen3 local-only structured extraction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_HOST: "127.0.0.1:11434"
      CUDA_VISIBLE_DEVICES: ""
      OLLAMA_NUM_GPU: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: ".python-version"
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-4b-${{ runner.os }}
      - name: Install pinned Ollama runtime
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/ollama-install.sh https://github.com/ollama/ollama/releases/download/v0.40.17/install.sh
          echo "eb510679f45de4a914d99953cd3deaada5dc73f9d585014df99d704449dd7dcc  /tmp/ollama-install.sh" | sha256sum --check -
          sh /tmp/ollama-install.sh
          ollama --version
      - name: Start local Ollama and pull model
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen3:4b
          mkdir -p benchmark-results/ollama-structured
          ollama list | tee benchmark-results/ollama-structured/model-manifest.txt
      - name: Verify OpenAI-compatible local endpoint
        run: curl -fsS http://127.0.0.1:11434/v1/models
      - name: Run local-only structured extraction smoke test
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 60m python scripts/run_ollama_structured_smoke.py --model qwen3:4b --output-dir benchmark-results/ollama-structured
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Per-sample structured extraction diagnostics (synthetic fixtures only)"
            if [ -f benchmark-results/ollama-structured/results.jsonl ]; then
              cat benchmark-results/ollama-structured/results.jsonl
            else
              echo "No per-sample results file was produced."
            fi
            for partial in benchmark-results/ollama-structured/*.raw.partial.txt; do
              if [ -f "$partial" ]; then
                echo "::group::Partial raw model output: $(basename "$partial")"
                cat "$partial"
                echo "::endgroup::"
              fi
            done
            echo "::endgroup::"
          fi
          exit "$status"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ollama-structured-smoke
          path: benchmark-results/ollama-structured/
          if-no-files-found: warn
          retention-days: 30
