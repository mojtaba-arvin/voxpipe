name: FLEURS language-ID calibration benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_fleurs_lid_benchmark.py"
      - "src/voxpipe/speech/language_id.py"
      - "tests/test_fleurs_lid_benchmark.py"
      - "requirements-lid-benchmark.txt"
      - ".github/workflows/fleurs-lid-calibration.yml"
  workflow_dispatch:

concurrency:
  group: fleurs-lid-calibration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Local SpeechBrain validation calibration and held-out test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ~/.cache/huggingface
      CUDA_VISIBLE_DEVICES: ""
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Cache pinned local model weights
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0
        with:
          path: ~/.cache/huggingface/hub
          key: speechbrain-voxlingua107-0253049-${{ runner.os }}
      - name: Install local benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-speech.txt
          python -m pip install --disable-pip-version-check -r requirements-lid-benchmark.txt
          mkdir -p benchmark-results/fleurs-lid
          python -m pip freeze > benchmark-results/fleurs-lid/pip-freeze.txt
      - name: Run strict 99% inventory-aware validation calibration and disjoint test evaluation
        run: |
          python scripts/run_fleurs_lid_benchmark.py \
            --calibration-samples 100 \
            --max-samples 100 \
            --min-selective-accuracy 0.99 \
            --min-coverage 0.50 \
            --output-dir benchmark-results/fleurs-lid
      - name: Upload calibration and evaluation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: fleurs-lid-calibration
          path: benchmark-results/fleurs-lid/
          if-no-files-found: warn
          retention-days: 30
