name: Neyshekar controlled Persian diarization benchmark

on:
  push:
    branches: [feat/phase2-6-execution-foundation]
    paths:
      - "scripts/run_neyshekar_diarization_benchmark.py"
      - "src/voxpipe/speech/diarization.py"
      - "requirements-lid.txt"
      - ".github/workflows/neyshekar-diarization-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diarization:
    name: ECAPA on anonymous Neyshekar speaker turns
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install CPU-only PyTorch runtime
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
      - name: Install local diarization benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lid.txt
      - name: Run controlled Persian diarization benchmark
        run: python scripts/run_neyshekar_diarization_benchmark.py --max-scan-rows 1000 --output-dir benchmark-results/neyshekar-diarization
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neyshekar-controlled-diarization-benchmark
          path: benchmark-results/neyshekar-diarization/
          if-no-files-found: warn
          retention-days: 30
