name: Common Voice Persian ASR evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-voice-asr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persian-asr:
    name: Bounded Qwen3-ASR Persian read-speech evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Cache pinned Qwen3-ASR model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/huggingface
          key: voxpipe-qwen3-asr-persian-v1-${{ hashFiles('requirements-eval-asr.txt') }}
      - name: Install pinned CPU-only PyTorch wheel from the official index
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.15.0+cpu
      - name: Install native Transformers ASR and Mozilla SDK dependencies
        run: uv pip install --system -r requirements-eval-asr.txt -r requirements-eval-mdc.txt
      - name: Install FFmpeg for bounded audio duration probing
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - name: Download only the publisher-provided sample
        id: sample
        env:
          MDC_API_KEY: ${{ secrets.MDC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MDC_API_KEY" || { echo "MDC_API_KEY repository secret is required." >&2; exit 1; }
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          from datacollective import download_sample

          dataset_id = "cmu5xazgy00finq074vaqo1b3"
          target = Path(os.environ["RUNNER_TEMP"]) / "voxpipe-common-voice-sample"
          target.mkdir(parents=True, exist_ok=True)
          archive = download_sample(
              dataset_id,
              download_directory=str(target),
              show_progress=False,
              enable_logging=False,
              extract=False,
          )
          archive_path = Path(archive).resolve()
          if not archive_path.is_file():
              raise RuntimeError("MDC SDK did not return a sample archive")
          print(f"archive={archive_path}")
          PY
      - name: Run bounded Persian Qwen3-ASR evaluation
        run: |
          python -m eval.issue47.qwen_transcription \
            --archive "${{ steps.sample.outputs.archive }}" \
            --max-clips 50
      - name: Upload aggregate metrics and provenance only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qwen3-asr-persian-read-speech
          path: eval/artifacts/issue47/qwen3_asr_persian.json
          if-no-files-found: warn
      - name: Remove temporary publisher sample
        if: always()
        run: rm -rf "$RUNNER_TEMP/voxpipe-common-voice-sample"
