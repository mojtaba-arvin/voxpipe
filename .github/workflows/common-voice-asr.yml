name: Common Voice Persian full-archive ASR evaluation

on:
  push:
    branches:
      - feat/common-voice-full-archive-evaluation
      - feat/qwen-persian-language-detection
  workflow_call:
    secrets:
      MDC_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-voice-asr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persian-asr:
    name: Bounded Qwen3-ASR Persian read-speech evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Cache pinned Qwen3-ASR model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/huggingface
          key: voxpipe-qwen3-asr-persian-v4-${{ hashFiles('requirements-eval-asr.txt', 'requirements-eval-align.txt', 'requirements-eval-lid.txt', 'eval/issue47/persian_alignment.py') }}
      - name: Install pinned CPU-only PyTorch wheel from the official index
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.15.0+cpu
      - name: Install native Transformers ASR and Mozilla SDK dependencies
        run: uv pip install --system -r requirements-eval-asr.txt -r requirements-eval-mdc.txt
      - name: Install pinned CPU-only torchaudio and independent language-ID runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torchaudio==2.15.0+cpu
          uv pip install --system -r requirements-eval-lid.txt
      - name: Install isolated WhisperX CPU alignment runtime
        run: |
          uv venv "$RUNNER_TEMP/voxpipe-align-venv" --python "$(command -v python)"
          grep -v '^whisperx==' requirements-eval-align.txt > "$RUNNER_TEMP/voxpipe-align-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/voxpipe-align-venv/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -r "$RUNNER_TEMP/voxpipe-align-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/voxpipe-align-venv/bin/python" \
            --index-url https://pypi.org/simple --no-deps whisperx==3.8.6
      - name: Install FFmpeg for bounded audio duration probing
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - name: Reclaim runner disk for the publisher's full archive
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h "$RUNNER_TEMP"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          required_kib=$((18 * 1024 * 1024))
          if (( available_kib < required_kib )); then
            echo "Full Common Voice evaluation requires at least 18 GiB free disk after cleanup; available: $((available_kib / 1024 / 1024)) GiB." >&2
            exit 1
          fi
      - name: Download and validate the complete publisher archive
        id: archive
        env:
          MDC_API_KEY: ${{ secrets.MDC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MDC_API_KEY" || { echo "MDC_API_KEY repository secret is required." >&2; exit 1; }
          archive_dir="$RUNNER_TEMP/voxpipe-common-voice-archive"
          python -m eval.issue47.common_voice_archive \
            --output eval/artifacts/issue47/common_voice_archive.json \
            --download-directory "$archive_dir"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("eval/artifacts/issue47/common_voice_archive.json").read_text(encoding="utf-8"))
          if report["status"] != "downloaded":
              raise SystemExit(f"Full Common Voice archive download failed: {report['status']}")
          archive_path = Path(os.environ["RUNNER_TEMP"]) / "voxpipe-common-voice-archive" / report["archive_name"]
          if not archive_path.is_file():
              raise SystemExit("Validated full Common Voice archive is missing from the job-local directory")
          print(f"archive={archive_path.resolve()}")
          PY
      - name: Run bounded Persian Qwen3-ASR evaluation
        run: |
          python -m eval.issue47.qwen_transcription \
            --archive "${{ steps.archive.outputs.archive }}" \
            --max-clips 50 \
            --intermediate-dir "$RUNNER_TEMP/voxpipe-qwen-alignment-input"
      - name: Run Persian WhisperX forced alignment on temporary Qwen hypotheses
        run: |
          "$RUNNER_TEMP/voxpipe-align-venv/bin/python" -m eval.issue47.persian_alignment \
            --manifest "$RUNNER_TEMP/voxpipe-qwen-alignment-input/alignment_input.jsonl" \
            --output eval/artifacts/issue47/alignment_cv.json \
            --speaker-output eval/artifacts/issue47/speaker_segments.json \
            --cache-dir "$HOME/.cache/huggingface" \
            --max-clips 50
      - name: Upload aggregate metrics and provenance only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: persian-read-speech-evaluation
          path: |
            eval/artifacts/issue47/common_voice_archive.json
            eval/artifacts/issue47/qwen3_asr_persian.json
            eval/artifacts/issue47/alignment_cv.json
            eval/artifacts/issue47/speaker_segments.json
          if-no-files-found: warn
      - name: Remove temporary full publisher archive
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/voxpipe-common-voice-archive"
          rm -rf "$RUNNER_TEMP/voxpipe-qwen-alignment-input"
