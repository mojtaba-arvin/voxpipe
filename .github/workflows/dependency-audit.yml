name: Dependency security audit

on:
  schedule:
    - cron: "17 5 * * 2"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "requirements*.txt"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: Audit Python requirement sets
        run: |
          set -euo pipefail
          for requirements in requirements-dev.txt requirements-benchmark.txt requirements-vad.txt requirements-lid.txt requirements-eval-mdc.txt requirements-eval-asr-audit.txt requirements-eval-whisperx-audit.txt; do
            if [[ -f "$requirements" ]]; then
              pip-audit --strict -r "$requirements"
            fi
          done

  go:
    name: Go vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Audit Go packages
        run: govulncheck ./...
