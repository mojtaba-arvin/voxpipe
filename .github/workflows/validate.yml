name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxpipe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOXPIPE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/voxpipe_test
      VOXPIPE_TEST_POSTGRES_APP_DSN: postgresql://voxpipe_app:voxpipe_app@localhost:5432/voxpipe_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            requirements-postgres.txt
      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Ensure FFmpeg integration-test binaries are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Validate repository and run Python tests
        run: make check

  go:
    name: Go API and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxpipe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOXPIPE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/voxpipe_test
      VOXPIPE_TEST_POSTGRES_APP_DSN: postgresql://voxpipe_app:voxpipe_app@localhost:5432/voxpipe_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python for database bootstrap
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-postgres.txt"
      - name: Install PostgreSQL test driver
        run: uv pip install --system -r requirements-postgres.txt
      - name: Prepare isolated PostgreSQL schema and RLS role
        run: PYTHONPATH=src python scripts/prepare_test_database.py
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Lint the evaluation workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Validate Go API, formatting, vet, race safety, and PostgreSQL integration
        run: make go-check

  observability:
    name: OpenTelemetry runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-observability.txt"
      - name: Install optional OpenTelemetry dependencies
        run: uv pip install --system -r requirements-observability.txt
      - name: Validate OTLP SDK bootstrap and safe shutdown
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_speech_telemetry_runtime.py'
          python -c 'from voxpipe.speech.telemetry_runtime import configure_speech_otel; runtime = configure_speech_otel(service_name="voxpipe-ci", trace_sample_ratio=0.0); runtime.shutdown()'

  postgres-backup-restore:
    name: PostgreSQL backup and restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxpipe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOXPIPE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/voxpipe_test
      VOXPIPE_TEST_POSTGRES_APP_DSN: postgresql://voxpipe_app:voxpipe_app@localhost:5432/voxpipe_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-postgres.txt"
      - name: Install Python PostgreSQL driver
        run: uv pip install --system -r requirements-postgres.txt
      - name: Prepare disposable PostgreSQL database
        env:
          PYTHONPATH: src
        run: python scripts/prepare_test_database.py
      - name: Verify custom-format backup, restore, and tenant isolation
        env:
          PYTHONPATH: src
          VOXPIPE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python scripts/verify_postgres_backup_restore.py

  telemetry-stack:
    name: OpenTelemetry Collector and Prometheus integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-observability.txt"
      - name: Install optional OpenTelemetry dependencies
        run: uv pip install --system -r requirements-observability.txt
      - name: Validate and exercise disposable Collector/Prometheus stack
        run: bash scripts/verify_telemetry_stack.sh

  common-voice-sample:
    name: Common Voice bounded sample provenance
    # Live MDC access is external and opt-in; offline tests run in Python validation.
    # Keep this check name as a skipped PR gate; use common-voice-sample.yml for manual acquisition.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain opt-in boundary
        run: |
          echo "Skipped: live Common Voice sample acquisition is manual and is not a pull-request gate."

  uv-install-benchmark:
    name: uv cold and warm dependency install benchmark
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect dependency or benchmark changes
        id: path-filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          while IFS= read -r path; do
            case "$path" in
              requirements*.txt|scripts/benchmark_uv_install.py|.github/workflows/validate.yml)
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$changed_files"
      - name: Set up Python
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: false
      - name: Measure cold and warm installs from clean environments
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        run: python scripts/benchmark_uv_install.py
      - name: Upload cold and warm install timings
        if: ${{ always() && steps.path-filter.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uv-install-cold-warm-benchmark
          path: eval/artifacts/ci/uv_install_benchmark.json
          if-no-files-found: warn

