name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxpipe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOXPIPE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/voxpipe_test
      VOXPIPE_TEST_POSTGRES_APP_DSN: postgresql://voxpipe_app:voxpipe_app@localhost:5432/voxpipe_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Ensure FFmpeg integration-test binaries are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Validate repository and run Python tests
        run: make check

  go:
    name: Go API and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxpipe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOXPIPE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/voxpipe_test
      VOXPIPE_TEST_POSTGRES_APP_DSN: postgresql://voxpipe_app:voxpipe_app@localhost:5432/voxpipe_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python for database bootstrap
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install PostgreSQL test driver
        run: uv pip install --system -r requirements-postgres.txt
      - name: Prepare isolated PostgreSQL schema and RLS role
        run: PYTHONPATH=src python scripts/prepare_test_database.py
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Lint the evaluation workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/eval.yml .github/workflows/validate.yml .github/workflows/common-voice-sample.yml .github/workflows/common-voice-asr.yml .github/workflows/dependency-audit.yml .github/workflows/qwen-cpu-smoke.yml
      - name: Validate Go API, formatting, vet, race safety, and PostgreSQL integration
        run: make go-check

  observability:
    name: OpenTelemetry runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install optional OpenTelemetry dependencies
        run: uv pip install --system -r requirements-observability.txt
      - name: Validate OTLP SDK bootstrap and safe shutdown
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_speech_telemetry_runtime.py'
          python -c 'from voxpipe.speech.telemetry_runtime import configure_speech_otel; runtime = configure_speech_otel(service_name="voxpipe-ci", trace_sample_ratio=0.0); runtime.shutdown()'

  postgres-backup-restore:
    name: PostgreSQL backup and restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxpipe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOXPIPE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/voxpipe_test
      VOXPIPE_TEST_POSTGRES_APP_DSN: postgresql://voxpipe_app:voxpipe_app@localhost:5432/voxpipe_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install Python PostgreSQL driver
        run: uv pip install --system -r requirements-postgres.txt
      - name: Prepare disposable PostgreSQL database
        env:
          PYTHONPATH: src
        run: python scripts/prepare_test_database.py
      - name: Verify custom-format backup, restore, and tenant isolation
        env:
          PYTHONPATH: src
          VOXPIPE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python scripts/verify_postgres_backup_restore.py

  telemetry-stack:
    name: OpenTelemetry Collector and Prometheus integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install optional OpenTelemetry dependencies
        run: uv pip install --system -r requirements-observability.txt
      - name: Validate and exercise disposable Collector/Prometheus stack
        run: bash scripts/verify_telemetry_stack.sh

  quickstart-e2e:
    name: Guided local quickstart end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Verify the guided local stack and sample ingestion
        run: python scripts/dev_quickstart.py up
      - name: Stop the disposable stack
        if: always()
        run: |
          if [ -f .env ]; then docker compose -f compose.yaml down; fi

  common-voice-sample:
    name: Common Voice bounded sample provenance
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect Common Voice integration changes
        id: path-filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if printf '%s\n' "$changed_files" | grep -F -e 'eval/issue47/common_voice_sample.py' -e 'eval/issue47/common_voice_sample.schema.json' -e 'requirements-eval-mdc.txt' -e 'tests/test_eval_common_voice.py' -e '.github/workflows/common-voice-sample.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install Mozilla Data Collective SDK
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        run: uv pip install --system -r requirements-dev.txt -r requirements-eval-mdc.txt
      - name: Run offline Common Voice tests
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        run: python -m unittest discover -s tests -p "test_eval_common_voice.py"
      - name: Download only the publisher-provided sample
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        env:
          MDC_API_KEY: ${{ secrets.MDC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MDC_API_KEY" || { echo "MDC_API_KEY repository secret is required." >&2; exit 1; }
          python -m eval.issue47.common_voice_sample
      - name: Upload audio-free dataset provenance
        if: ${{ always() && steps.path-filter.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: common-voice-persian-sample-provenance
          path: eval/artifacts/issue47/common_voice_sample.json
          if-no-files-found: warn

  uv-install-benchmark:
    name: uv cold and warm dependency install benchmark
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect dependency or benchmark changes
        id: path-filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          while IFS= read -r path; do
            case "$path" in
              requirements*.txt|scripts/benchmark_uv_install.py|.github/workflows/validate.yml)
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$changed_files"
      - name: Set up Python
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: false
      - name: Measure cold and warm installs from clean environments
        if: ${{ steps.path-filter.outputs.run == 'true' }}
        run: python scripts/benchmark_uv_install.py
      - name: Upload cold and warm install timings
        if: ${{ always() && steps.path-filter.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uv-install-cold-warm-benchmark
          path: eval/artifacts/ci/uv_install_benchmark.json
          if-no-files-found: warn

  s3-storage:
    name: S3-compatible storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache: true
      - name: Install optional S3 SDK
        run: uv pip install --system -r requirements-s3.txt
      - name: Start disposable Silo with server-side encryption
        run: |
          docker run --detach --name voxpipe-silo \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=voxpipe-ci \
            --env MINIO_ROOT_PASSWORD=voxpipe-ci-secret-password \
            --env MINIO_KMS_SECRET_KEY=voxpipe-ci:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE= \
            docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z server /data
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs voxpipe-silo
          exit 1
      - name: Verify Python S3-compatible object lifecycle
        env:
          PYTHONPATH: src
          VOXPIPE_STORAGE_BACKEND: s3_compatible
          VOXPIPE_S3_BUCKET: voxpipe-ci-${{ github.run_id }}
          VOXPIPE_S3_REGION: us-east-1
          VOXPIPE_S3_ENDPOINT_URL: http://127.0.0.1:9000
          VOXPIPE_S3_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_STAGING_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: AES256
          VOXPIPE_S3_ADDRESSING_STYLE: path
          VOXPIPE_S3_MAX_ATTEMPTS: "3"
          VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS: "5"
          VOXPIPE_S3_READ_TIMEOUT_SECONDS: "60"
        run: python -m unittest discover -s tests -p 'test_s3_storage_integration.py' -v
      - name: Verify Go API S3 staging against the same Silo bucket
        env:
          VOXPIPE_STORAGE_BACKEND: s3_compatible
          VOXPIPE_S3_BUCKET: voxpipe-ci-${{ github.run_id }}
          VOXPIPE_S3_REGION: us-east-1
          VOXPIPE_S3_ENDPOINT_URL: http://127.0.0.1:9000
          VOXPIPE_S3_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_STAGING_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: AES256
          VOXPIPE_S3_ADDRESSING_STYLE: path
          VOXPIPE_S3_MAX_ATTEMPTS: "3"
          VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS: "5"
          VOXPIPE_S3_READ_TIMEOUT_SECONDS: "60"
        run: go test ./internal/httpapi -run '^TestS3StagerSiloIntegration$' -count=1 -v
      - name: Verify Python worker reads Go-staged object
        env:
          PYTHONPATH: src
          VOXPIPE_STORAGE_BACKEND: s3_compatible
          VOXPIPE_S3_BUCKET: voxpipe-ci-${{ github.run_id }}
          VOXPIPE_S3_REGION: us-east-1
          VOXPIPE_S3_ENDPOINT_URL: http://127.0.0.1:9000
          VOXPIPE_S3_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: AES256
          VOXPIPE_S3_ADDRESSING_STYLE: path
          VOXPIPE_S3_MAX_ATTEMPTS: "3"
          VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS: "5"
          VOXPIPE_S3_READ_TIMEOUT_SECONDS: "60"
        run: python scripts/verify_s3_staging_interop.py
      - name: Build the optional S3-enabled ingestion worker image
        run: docker build --build-arg VOXPIPE_INSTALL_S3=1 -f Dockerfile.worker -t voxpipe-worker-s3:ci .
      - name: Stop adapter-level Silo before isolated deployment E2E
        run: docker rm -f voxpipe-silo || true
      - name: Prepare ephemeral S3 deployment credentials
        run: python scripts/prepare_s3_e2e_env.py
      - name: Validate isolated deployment Compose configuration
        run: docker compose -f compose.s3-e2e.yaml config --quiet
      - name: Start PostgreSQL and disposable Silo for identity provisioning
        run: |
          docker compose -f compose.s3-e2e.yaml up --build --detach postgres bootstrap silo silo-init
          docker compose -f compose.s3-e2e.yaml wait bootstrap silo-init
      - name: Configure and verify S3 staging lifecycle and recovery
        env:
          SILO_ROOT_ACCESS_KEY_ID: ${{ env.SILO_ROOT_ACCESS_KEY_ID }}
          SILO_ROOT_SECRET_ACCESS_KEY: ${{ env.SILO_ROOT_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_BUCKET: ${{ env.VOXPIPE_S3_BUCKET }}
          VOXPIPE_S3_RECOVERY_BUCKET: ${{ env.VOXPIPE_S3_RECOVERY_BUCKET }}
          VOXPIPE_S3_REGION: ${{ env.VOXPIPE_S3_REGION }}
          VOXPIPE_S3_ENDPOINT_URL: ${{ env.VOXPIPE_S3_ENDPOINT_URL }}
          VOXPIPE_S3_ADDRESSING_STYLE: ${{ env.VOXPIPE_S3_ADDRESSING_STYLE }}
          VOXPIPE_S3_STAGING_LIFECYCLE_DAYS: ${{ env.VOXPIPE_S3_STAGING_LIFECYCLE_DAYS }}
          VOXPIPE_S3_STAGING_RECOVERY_WINDOW_SECONDS: ${{ env.VOXPIPE_S3_STAGING_RECOVERY_WINDOW_SECONDS }}
          VOXPIPE_S3_STAGING_SAFETY_MARGIN_DAYS: ${{ env.VOXPIPE_S3_STAGING_SAFETY_MARGIN_DAYS }}
          VOXPIPE_SESSION_TTL_SECONDS: ${{ env.VOXPIPE_SESSION_TTL_SECONDS }}
          VOXPIPE_JOB_MAX_ATTEMPTS: ${{ env.VOXPIPE_JOB_MAX_ATTEMPTS }}
          VOXPIPE_JOB_LEASE_SECONDS: ${{ env.VOXPIPE_JOB_LEASE_SECONDS }}
          VOXPIPE_WORKER_MAX_BACKOFF_SECONDS: ${{ env.VOXPIPE_WORKER_MAX_BACKOFF_SECONDS }}
        run: |
          python scripts/configure_s3_e2e_bucket.py
          python scripts/validate_s3_lifecycle_policy.py
          python scripts/verify_s3_version_recovery.py
      - name: Provision distinct least-privilege S3 runtime identities
        env:
          SILO_ROOT_ACCESS_KEY_ID: ${{ env.SILO_ROOT_ACCESS_KEY_ID }}
          SILO_ROOT_SECRET_ACCESS_KEY: ${{ env.SILO_ROOT_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_STAGING_ACCESS_KEY_ID: ${{ env.VOXPIPE_S3_STAGING_ACCESS_KEY_ID }}
          VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY: ${{ env.VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_ACCESS_KEY_ID: ${{ env.VOXPIPE_S3_ACCESS_KEY_ID }}
          VOXPIPE_S3_SECRET_ACCESS_KEY: ${{ env.VOXPIPE_S3_SECRET_ACCESS_KEY }}
        run: |
          mc_image=docker.io/pgsty/mc:RELEASE.2026-11-12T00-00-00Z
          mc_host="http://$SILO_ROOT_ACCESS_KEY_ID:$SILO_ROOT_SECRET_ACCESS_KEY@127.0.0.1:9000"
          run_mc() {
            docker run --rm --network host --entrypoint mc \
              -e "MC_HOST_local=$mc_host" \
              -v "$GITHUB_WORKSPACE/deploy/s3/policies:/policies:ro" \
              "$mc_image" "$@"
          }
          run_mc admin policy create local voxpipe-api-staging /policies/api-staging.json
          run_mc admin policy create local voxpipe-worker-storage /policies/worker-storage.json
          run_mc admin user add local "$VOXPIPE_S3_STAGING_ACCESS_KEY_ID" "$VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY"
          run_mc admin user add local "$VOXPIPE_S3_ACCESS_KEY_ID" "$VOXPIPE_S3_SECRET_ACCESS_KEY"
          run_mc admin policy attach local voxpipe-api-staging --user "$VOXPIPE_S3_STAGING_ACCESS_KEY_ID"
          run_mc admin policy attach local voxpipe-worker-storage --user "$VOXPIPE_S3_ACCESS_KEY_ID"
      - name: Start Go API and Python worker without shared staging storage
        run: docker compose -f compose.s3-e2e.yaml up --build --detach --wait --wait-timeout 180 api worker
      - name: Upload and process generated audio through Go API and Python queue worker
        id: s3-deployment-e2e
        env:
          PYTHONPATH: src
          VOXPIPE_API_URL: http://127.0.0.1:8080
          VOXPIPE_API_TOKEN: ${{ env.VOXPIPE_API_TOKEN }}
          TENANT_ID: ${{ env.TENANT_ID }}
          VOXPIPE_S3_BUCKET: ${{ env.VOXPIPE_S3_BUCKET }}
          VOXPIPE_S3_REGION: ${{ env.VOXPIPE_S3_REGION }}
          VOXPIPE_S3_ENDPOINT_URL: ${{ env.VOXPIPE_S3_ENDPOINT_URL }}
          VOXPIPE_S3_STAGING_ACCESS_KEY_ID: ${{ env.VOXPIPE_S3_STAGING_ACCESS_KEY_ID }}
          VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY: ${{ env.VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: ${{ env.VOXPIPE_S3_SERVER_SIDE_ENCRYPTION }}
          VOXPIPE_S3_ADDRESSING_STYLE: ${{ env.VOXPIPE_S3_ADDRESSING_STYLE }}
        run: |
          python scripts/verify_s3_staging_deployment.py > /tmp/voxpipe-s3-deployment-e2e.json
          cat /tmp/voxpipe-s3-deployment-e2e.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("/tmp/voxpipe-s3-deployment-e2e.json", encoding="utf-8") as stream:
              result = json.load(stream)
          for key in ("session_id", "asset_id", "expected_sha256"):
              print(f"{key}={result[key]}")
          PY
      - name: Reconcile completed staging from the isolated worker container
        run: docker compose -f compose.s3-e2e.yaml exec -T worker python scripts/reconcile_ingestion.py --tenant-id "$TENANT_ID" --limit 100
      - name: Verify staging removal and durable object retention
        env:
          PYTHONPATH: src
          VOXPIPE_STORAGE_BACKEND: s3_compatible
          VOXPIPE_S3_BUCKET: ${{ env.VOXPIPE_S3_BUCKET }}
          VOXPIPE_S3_REGION: ${{ env.VOXPIPE_S3_REGION }}
          VOXPIPE_S3_ENDPOINT_URL: ${{ env.VOXPIPE_S3_ENDPOINT_URL }}
          VOXPIPE_S3_ACCESS_KEY_ID: ${{ env.VOXPIPE_S3_ACCESS_KEY_ID }}
          VOXPIPE_S3_SECRET_ACCESS_KEY: ${{ env.VOXPIPE_S3_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: ${{ env.VOXPIPE_S3_SERVER_SIDE_ENCRYPTION }}
          VOXPIPE_S3_ADDRESSING_STYLE: ${{ env.VOXPIPE_S3_ADDRESSING_STYLE }}
          VOXPIPE_S3_MAX_ATTEMPTS: ${{ env.VOXPIPE_S3_MAX_ATTEMPTS }}
          VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS: ${{ env.VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS }}
          VOXPIPE_S3_READ_TIMEOUT_SECONDS: ${{ env.VOXPIPE_S3_READ_TIMEOUT_SECONDS }}
        run: |
          python scripts/verify_s3_staging_cleanup.py \
            --tenant-id "$TENANT_ID" \
            --session-id "${{ steps.s3-deployment-e2e.outputs.session_id }}" \
            --asset-id "${{ steps.s3-deployment-e2e.outputs.asset_id }}" \
            --expected-sha256 "${{ steps.s3-deployment-e2e.outputs.expected_sha256 }}"
      - name: Stop isolated S3 deployment stack
        if: always()
        run: docker compose -f compose.s3-e2e.yaml down --volumes --remove-orphans || true
      - name: Stop disposable Silo
        if: always()
        run: docker rm -f voxpipe-silo || true
