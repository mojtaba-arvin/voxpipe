name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxpipe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOXPIPE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/voxpipe_test
      VOXPIPE_TEST_POSTGRES_APP_DSN: postgresql://voxpipe_app:voxpipe_app@localhost:5432/voxpipe_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Ensure FFmpeg integration-test binaries are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Validate repository and run Python tests
        run: make check

  go:
    name: Go API and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxpipe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOXPIPE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/voxpipe_test
      VOXPIPE_TEST_POSTGRES_APP_DSN: postgresql://voxpipe_app:voxpipe_app@localhost:5432/voxpipe_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python for database bootstrap
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Install PostgreSQL test driver
        run: python -m pip install --disable-pip-version-check -r requirements-postgres.txt
      - name: Prepare isolated PostgreSQL schema and RLS role
        run: PYTHONPATH=src python scripts/prepare_test_database.py
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Validate Go API, formatting, vet, race safety, and PostgreSQL integration
        run: make go-check

  observability:
    name: OpenTelemetry runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Install optional OpenTelemetry dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-observability.txt
      - name: Validate OTLP SDK bootstrap and safe shutdown
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_speech_telemetry_runtime.py'
          python -c 'from voxpipe.speech.telemetry_runtime import configure_speech_otel; runtime = configure_speech_otel(service_name="voxpipe-ci", trace_sample_ratio=0.0); runtime.shutdown()'

  postgres-backup-restore:
    name: PostgreSQL backup and restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voxpipe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOXPIPE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/voxpipe_test
      VOXPIPE_TEST_POSTGRES_APP_DSN: postgresql://voxpipe_app:voxpipe_app@localhost:5432/voxpipe_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Install Python PostgreSQL driver
        run: python -m pip install --disable-pip-version-check -r requirements-postgres.txt
      - name: Prepare disposable PostgreSQL database
        env:
          PYTHONPATH: src
        run: python scripts/prepare_test_database.py
      - name: Verify custom-format backup, restore, and tenant isolation
        env:
          PYTHONPATH: src
          VOXPIPE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python scripts/verify_postgres_backup_restore.py

  telemetry-stack:
    name: OpenTelemetry Collector and Prometheus integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
      - name: Install optional OpenTelemetry dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-observability.txt
      - name: Validate and exercise disposable Collector/Prometheus stack
        run: bash scripts/verify_telemetry_stack.sh

  quickstart-e2e:
    name: Guided local quickstart end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Verify the guided local stack and sample ingestion
        run: python scripts/dev_quickstart.py up
      - name: Stop the disposable stack
        if: always()
        run: |
          if [ -f .env ]; then docker compose -f compose.yaml down; fi

  s3-storage:
    name: S3-compatible storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Install optional S3 SDK
        run: python -m pip install --disable-pip-version-check -r requirements-s3.txt
      - name: Start disposable MinIO with server-side encryption
        run: |
          docker run --detach --name voxpipe-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=voxpipe-ci \
            --env MINIO_ROOT_PASSWORD=voxpipe-ci-secret-password \
            --env MINIO_KMS_SECRET_KEY=voxpipe-ci:01234567890123456789012345678901 \
            minio/minio:RELEASE.2025-02-07T23-21-09Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs voxpipe-minio
          exit 1
      - name: Verify shared S3-compatible object lifecycle
        env:
          PYTHONPATH: src
          VOXPIPE_STORAGE_BACKEND: s3_compatible
          VOXPIPE_S3_BUCKET: voxpipe-ci-${{ github.run_id }}
          VOXPIPE_S3_REGION: us-east-1
          VOXPIPE_S3_ENDPOINT_URL: http://127.0.0.1:9000
          VOXPIPE_S3_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: AES256
          VOXPIPE_S3_ADDRESSING_STYLE: path
        run: python -m unittest discover -s tests -p 'test_s3_storage_integration.py' -v
      - name: Stop disposable MinIO
        if: always()
        run: docker rm -f voxpipe-minio || true
