name: Runtime integration validation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "cmd/**"
      - "internal/**"
      - "contracts/**"
      - "scripts/bootstrap_local_postgres.py"
      - "scripts/prepare_s3_e2e_bucket.py"
      - "scripts/run_ingestion_worker.py"
      - "scripts/voxpipe_cli.py"
      - "migrations/**"
      - "compose*.yaml"
      - "Dockerfile*"
      - "scripts/dev_quickstart.py"
      - "scripts/prepare_s3_e2e_env.py"
      - "scripts/configure_s3_e2e_bucket.py"
      - "scripts/validate_s3_lifecycle_policy.py"
      - "scripts/verify_s3*.py"
      - "scripts/reconcile_ingestion.py"
      - "deploy/s3/**"
      - "requirements-s3.txt"
      - "requirements-dev.txt"
      - "requirements-postgres.txt"
      - "tests/test_dev_quickstart.py"
      - "tests/test_s3_storage_integration.py"
      - ".github/workflows/runtime-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "cmd/**"
      - "internal/**"
      - "contracts/**"
      - "scripts/bootstrap_local_postgres.py"
      - "scripts/prepare_s3_e2e_bucket.py"
      - "scripts/run_ingestion_worker.py"
      - "scripts/voxpipe_cli.py"
      - "migrations/**"
      - "compose*.yaml"
      - "Dockerfile*"
      - "scripts/dev_quickstart.py"
      - "scripts/prepare_s3_e2e_env.py"
      - "scripts/configure_s3_e2e_bucket.py"
      - "scripts/validate_s3_lifecycle_policy.py"
      - "scripts/verify_s3*.py"
      - "scripts/reconcile_ingestion.py"
      - "deploy/s3/**"
      - "requirements-s3.txt"
      - "requirements-dev.txt"
      - "requirements-postgres.txt"
      - "tests/test_dev_quickstart.py"
      - "tests/test_s3_storage_integration.py"
      - ".github/workflows/runtime-integration.yml"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickstart-e2e:
    name: Guided local quickstart end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-dev.txt"
      - name: Verify the guided local stack and sample ingestion
        run: python scripts/dev_quickstart.py up
      - name: Stop the disposable stack
        if: always()
        run: |
          if [ -f .env ]; then docker compose -f compose.yaml down; fi

  s3-storage:
    name: S3-compatible storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-postgres.txt
            requirements-s3.txt
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache: true
      - name: Cache Go build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-voxpipe-s3-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-voxpipe-s3-go-build-
      - name: Install optional S3 SDK
        run: uv pip install --system -r requirements-s3.txt
      - name: Start disposable Silo with server-side encryption
        run: |
          docker run --detach --name voxpipe-silo \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=voxpipe-ci \
            --env MINIO_ROOT_PASSWORD=voxpipe-ci-secret-password \
            --env MINIO_KMS_SECRET_KEY=voxpipe-ci:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE= \
            docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z server /data
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs voxpipe-silo
          exit 1
      - name: Verify Python S3-compatible object lifecycle
        env:
          PYTHONPATH: src
          VOXPIPE_STORAGE_BACKEND: s3_compatible
          VOXPIPE_S3_BUCKET: voxpipe-ci-${{ github.run_id }}
          VOXPIPE_S3_REGION: us-east-1
          VOXPIPE_S3_ENDPOINT_URL: http://127.0.0.1:9000
          VOXPIPE_S3_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_STAGING_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: AES256
          VOXPIPE_S3_ADDRESSING_STYLE: path
          VOXPIPE_S3_MAX_ATTEMPTS: "3"
          VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS: "5"
          VOXPIPE_S3_READ_TIMEOUT_SECONDS: "60"
        run: python -m unittest discover -s tests -p 'test_s3_storage_integration.py' -v
      - name: Verify Go API S3 staging against the same Silo bucket
        env:
          VOXPIPE_STORAGE_BACKEND: s3_compatible
          VOXPIPE_S3_BUCKET: voxpipe-ci-${{ github.run_id }}
          VOXPIPE_S3_REGION: us-east-1
          VOXPIPE_S3_ENDPOINT_URL: http://127.0.0.1:9000
          VOXPIPE_S3_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_STAGING_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: AES256
          VOXPIPE_S3_ADDRESSING_STYLE: path
          VOXPIPE_S3_MAX_ATTEMPTS: "3"
          VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS: "5"
          VOXPIPE_S3_READ_TIMEOUT_SECONDS: "60"
        run: go test ./internal/httpapi -run '^TestS3StagerSiloIntegration$' -count=1 -v
      - name: Verify Python worker reads Go-staged object
        env:
          PYTHONPATH: src
          VOXPIPE_STORAGE_BACKEND: s3_compatible
          VOXPIPE_S3_BUCKET: voxpipe-ci-${{ github.run_id }}
          VOXPIPE_S3_REGION: us-east-1
          VOXPIPE_S3_ENDPOINT_URL: http://127.0.0.1:9000
          VOXPIPE_S3_ACCESS_KEY_ID: voxpipe-ci
          VOXPIPE_S3_SECRET_ACCESS_KEY: voxpipe-ci-secret-password
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: AES256
          VOXPIPE_S3_ADDRESSING_STYLE: path
          VOXPIPE_S3_MAX_ATTEMPTS: "3"
          VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS: "5"
          VOXPIPE_S3_READ_TIMEOUT_SECONDS: "60"
        run: python scripts/verify_s3_staging_interop.py
      - name: Restore Docker BuildKit layer caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            /tmp/voxpipe-buildx-worker
            /tmp/voxpipe-buildx-api
          key: ${{ runner.os }}-voxpipe-buildx-${{ hashFiles('Dockerfile.worker', 'Dockerfile.api', 'requirements*.txt', 'src/**', 'migrations/**') }}
          restore-keys: |
            ${{ runner.os }}-voxpipe-buildx-
      - name: Prepare BuildKit builder
        run: |
          mkdir -p /tmp/voxpipe-buildx-worker /tmp/voxpipe-buildx-api
          docker buildx create --name voxpipe-ci --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Build reusable S3 worker and API images with layer caches
        shell: bash
        run: |
          set -euo pipefail
          build_cached() {
            local dockerfile="$1" image="$2" cache_dir="$3"
            local next_dir="${cache_dir}-next"
            local cache_args=()
            local build_args=()
            rm -rf "$next_dir"
            if [[ -f "$cache_dir/index.json" ]]; then
              cache_args+=(--cache-from "type=local,src=$cache_dir")
            fi
            if [[ "$dockerfile" == "Dockerfile.worker" ]]; then
              build_args+=(--build-arg VOXPIPE_INSTALL_S3=1)
            fi
            docker buildx build --load \
              "${cache_args[@]}" \
              --cache-to "type=local,dest=$next_dir,mode=max" \
              "${build_args[@]}" -f "$dockerfile" -t "$image" .
            rm -rf "$cache_dir"
            mv "$next_dir" "$cache_dir"
          }
          build_cached Dockerfile.worker voxpipe-worker-s3-e2e:ci /tmp/voxpipe-buildx-worker
          build_cached Dockerfile.api voxpipe-api-s3-e2e:ci /tmp/voxpipe-buildx-api
      - name: Stop adapter-level Silo before isolated deployment E2E
        run: docker rm -f voxpipe-silo || true
      - name: Prepare ephemeral S3 deployment credentials
        run: python scripts/prepare_s3_e2e_env.py
      - name: Validate isolated deployment Compose configuration
        run: docker compose -f compose.s3-e2e.yaml config --quiet
      - name: Start PostgreSQL and disposable Silo for identity provisioning
        run: |
          docker compose -f compose.s3-e2e.yaml up --no-build --detach postgres bootstrap silo silo-init
          docker compose -f compose.s3-e2e.yaml wait bootstrap silo-init
      - name: Configure and verify S3 staging lifecycle and recovery
        env:
          SILO_ROOT_ACCESS_KEY_ID: ${{ env.SILO_ROOT_ACCESS_KEY_ID }}
          SILO_ROOT_SECRET_ACCESS_KEY: ${{ env.SILO_ROOT_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_BUCKET: ${{ env.VOXPIPE_S3_BUCKET }}
          VOXPIPE_S3_RECOVERY_BUCKET: ${{ env.VOXPIPE_S3_RECOVERY_BUCKET }}
          VOXPIPE_S3_REGION: ${{ env.VOXPIPE_S3_REGION }}
          VOXPIPE_S3_ENDPOINT_URL: ${{ env.VOXPIPE_S3_ENDPOINT_URL }}
          VOXPIPE_S3_ADDRESSING_STYLE: ${{ env.VOXPIPE_S3_ADDRESSING_STYLE }}
          VOXPIPE_S3_STAGING_LIFECYCLE_DAYS: ${{ env.VOXPIPE_S3_STAGING_LIFECYCLE_DAYS }}
          VOXPIPE_S3_STAGING_RECOVERY_WINDOW_SECONDS: ${{ env.VOXPIPE_S3_STAGING_RECOVERY_WINDOW_SECONDS }}
          VOXPIPE_S3_STAGING_SAFETY_MARGIN_DAYS: ${{ env.VOXPIPE_S3_STAGING_SAFETY_MARGIN_DAYS }}
          VOXPIPE_SESSION_TTL_SECONDS: ${{ env.VOXPIPE_SESSION_TTL_SECONDS }}
          VOXPIPE_JOB_MAX_ATTEMPTS: ${{ env.VOXPIPE_JOB_MAX_ATTEMPTS }}
          VOXPIPE_JOB_LEASE_SECONDS: ${{ env.VOXPIPE_JOB_LEASE_SECONDS }}
          VOXPIPE_WORKER_MAX_BACKOFF_SECONDS: ${{ env.VOXPIPE_WORKER_MAX_BACKOFF_SECONDS }}
        run: |
          python scripts/configure_s3_e2e_bucket.py
          python scripts/validate_s3_lifecycle_policy.py
          python scripts/verify_s3_version_recovery.py
      - name: Provision distinct least-privilege S3 runtime identities
        env:
          SILO_ROOT_ACCESS_KEY_ID: ${{ env.SILO_ROOT_ACCESS_KEY_ID }}
          SILO_ROOT_SECRET_ACCESS_KEY: ${{ env.SILO_ROOT_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_STAGING_ACCESS_KEY_ID: ${{ env.VOXPIPE_S3_STAGING_ACCESS_KEY_ID }}
          VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY: ${{ env.VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_ACCESS_KEY_ID: ${{ env.VOXPIPE_S3_ACCESS_KEY_ID }}
          VOXPIPE_S3_SECRET_ACCESS_KEY: ${{ env.VOXPIPE_S3_SECRET_ACCESS_KEY }}
        run: |
          mc_image=docker.io/pgsty/mc:RELEASE.2026-11-12T00-00-00Z
          mc_host="http://$SILO_ROOT_ACCESS_KEY_ID:$SILO_ROOT_SECRET_ACCESS_KEY@127.0.0.1:9000"
          run_mc() {
            docker run --rm --network host --entrypoint mc \
              -e "MC_HOST_local=$mc_host" \
              -v "$GITHUB_WORKSPACE/deploy/s3/policies:/policies:ro" \
              "$mc_image" "$@"
          }
          run_mc admin policy create local voxpipe-api-staging /policies/api-staging.json
          run_mc admin policy create local voxpipe-worker-storage /policies/worker-storage.json
          run_mc admin user add local "$VOXPIPE_S3_STAGING_ACCESS_KEY_ID" "$VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY"
          run_mc admin user add local "$VOXPIPE_S3_ACCESS_KEY_ID" "$VOXPIPE_S3_SECRET_ACCESS_KEY"
          run_mc admin policy attach local voxpipe-api-staging --user "$VOXPIPE_S3_STAGING_ACCESS_KEY_ID"
          run_mc admin policy attach local voxpipe-worker-storage --user "$VOXPIPE_S3_ACCESS_KEY_ID"
      - name: Start Go API and Python worker without shared staging storage
        run: docker compose -f compose.s3-e2e.yaml up --no-build --detach --wait --wait-timeout 180 api worker
      - name: Upload and process generated audio through Go API and Python queue worker
        id: s3-deployment-e2e
        env:
          PYTHONPATH: src
          VOXPIPE_API_URL: http://127.0.0.1:8080
          VOXPIPE_API_TOKEN: ${{ env.VOXPIPE_API_TOKEN }}
          TENANT_ID: ${{ env.TENANT_ID }}
          VOXPIPE_S3_BUCKET: ${{ env.VOXPIPE_S3_BUCKET }}
          VOXPIPE_S3_REGION: ${{ env.VOXPIPE_S3_REGION }}
          VOXPIPE_S3_ENDPOINT_URL: ${{ env.VOXPIPE_S3_ENDPOINT_URL }}
          VOXPIPE_S3_STAGING_ACCESS_KEY_ID: ${{ env.VOXPIPE_S3_STAGING_ACCESS_KEY_ID }}
          VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY: ${{ env.VOXPIPE_S3_STAGING_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: ${{ env.VOXPIPE_S3_SERVER_SIDE_ENCRYPTION }}
          VOXPIPE_S3_ADDRESSING_STYLE: ${{ env.VOXPIPE_S3_ADDRESSING_STYLE }}
        run: |
          python scripts/verify_s3_staging_deployment.py > /tmp/voxpipe-s3-deployment-e2e.json
          cat /tmp/voxpipe-s3-deployment-e2e.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("/tmp/voxpipe-s3-deployment-e2e.json", encoding="utf-8") as stream:
              result = json.load(stream)
          for key in ("session_id", "asset_id", "expected_sha256"):
              print(f"{key}={result[key]}")
          PY
      - name: Reconcile completed staging from the isolated worker container
        run: docker compose -f compose.s3-e2e.yaml exec -T worker python scripts/reconcile_ingestion.py --tenant-id "$TENANT_ID" --limit 100
      - name: Verify staging removal and durable object retention
        env:
          PYTHONPATH: src
          VOXPIPE_STORAGE_BACKEND: s3_compatible
          VOXPIPE_S3_BUCKET: ${{ env.VOXPIPE_S3_BUCKET }}
          VOXPIPE_S3_REGION: ${{ env.VOXPIPE_S3_REGION }}
          VOXPIPE_S3_ENDPOINT_URL: ${{ env.VOXPIPE_S3_ENDPOINT_URL }}
          VOXPIPE_S3_ACCESS_KEY_ID: ${{ env.VOXPIPE_S3_ACCESS_KEY_ID }}
          VOXPIPE_S3_SECRET_ACCESS_KEY: ${{ env.VOXPIPE_S3_SECRET_ACCESS_KEY }}
          VOXPIPE_S3_SERVER_SIDE_ENCRYPTION: ${{ env.VOXPIPE_S3_SERVER_SIDE_ENCRYPTION }}
          VOXPIPE_S3_ADDRESSING_STYLE: ${{ env.VOXPIPE_S3_ADDRESSING_STYLE }}
          VOXPIPE_S3_MAX_ATTEMPTS: ${{ env.VOXPIPE_S3_MAX_ATTEMPTS }}
          VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS: ${{ env.VOXPIPE_S3_CONNECT_TIMEOUT_SECONDS }}
          VOXPIPE_S3_READ_TIMEOUT_SECONDS: ${{ env.VOXPIPE_S3_READ_TIMEOUT_SECONDS }}
        run: |
          python scripts/verify_s3_staging_cleanup.py \
            --tenant-id "$TENANT_ID" \
            --session-id "${{ steps.s3-deployment-e2e.outputs.session_id }}" \
            --asset-id "${{ steps.s3-deployment-e2e.outputs.asset_id }}" \
            --expected-sha256 "${{ steps.s3-deployment-e2e.outputs.expected_sha256 }}"
      - name: Stop isolated S3 deployment stack
        if: always()
        run: docker compose -f compose.s3-e2e.yaml down --volumes --remove-orphans || true
      - name: Stop disposable Silo
        if: always()
        run: docker rm -f voxpipe-silo || true
