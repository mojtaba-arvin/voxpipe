name: Qwen CPU smoke PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/eval.yml"
      - ".github/workflows/eval-qwen-smoke-pr.yml"
      - "eval/issue47/cpu_smoke.py"
      - "requirements-eval-asr.txt"
      - "eval/issue47/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: qwen-cpu-smoke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qwen-cpu-smoke:
    name: Qwen3-ASR CPU feasibility smoke
    uses: ./.github/workflows/eval.yml
    with:
      run_eval_32: false
      run_eval_48: false
      run_eval_47: true
      run_tts_overlap: false
      corpus_path: ""
