name: Persian FLEURS CPU benchmark

on:
  push:
    branches: [feat/phase2-6-execution-foundation]
    paths:
      - "scripts/run_fleurs_stt_benchmark.py"
      - "scripts/benchmark_stt.py"
      - "scripts/validate_corpus_manifest.py"
      - "contracts/schemas/speech-corpus-manifest.v1.schema.json"
      - "requirements-benchmark.txt"
      - ".github/workflows/persian-fleurs-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persian-cpu-benchmark:
    name: Faster-Whisper on pinned FLEURS Persian test split
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install public benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-benchmark.txt
      - name: Run 100-sample Persian CPU benchmark
        run: python scripts/run_fleurs_stt_benchmark.py --max-samples 100 --output-dir benchmark-results/fleurs-fa-ir
      - name: Validate generated corpus manifest
        run: python scripts/validate_corpus_manifest.py benchmark-results/fleurs-fa-ir/corpus-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persian-fleurs-cpu-benchmark
          path: benchmark-results/fleurs-fa-ir/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit reproducible benchmark outputs
        if: success()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          destination=benchmarks/results/fleurs-fa-ir-2026-11-21
          mkdir -p "$destination"
          cp benchmark-results/fleurs-fa-ir/summary.json "$destination/summary.json"
          cp benchmark-results/fleurs-fa-ir/corpus-manifest.json "$destination/corpus-manifest.json"
          cp benchmark-results/fleurs-fa-ir/results.jsonl "$destination/results.jsonl"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record measured 100-sample Persian FLEURS ASR benchmark"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
