name: Persian FLEURS CPU benchmark

on:
  push:
    branches: [feat/phase2-6-execution-foundation]
    paths:
      - "scripts/run_fleurs_stt_benchmark.py"
      - "scripts/benchmark_stt.py"
      - "scripts/validate_corpus_manifest.py"
      - "contracts/schemas/speech-corpus-manifest.v1.schema.json"
      - "requirements-benchmark.txt"
      - ".github/workflows/persian-fleurs-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persian-fleurs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Faster-Whisper on pinned FLEURS Persian test split
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: ".python-version"
      - name: Install public benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-benchmark.txt
      - name: Run 100-sample Persian CPU benchmark
        run: python scripts/run_fleurs_stt_benchmark.py --max-samples 100 --output-dir benchmark-results/fleurs-fa-ir
      - name: Validate generated corpus manifest
        run: python scripts/validate_corpus_manifest.py benchmark-results/fleurs-fa-ir/corpus-manifest.json
      - name: Validate result count and pinned revisions
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.dataset.id == "google/fleurs" and .dataset.config == "fa_ir" and .dataset.split == "test" and .dataset.samples == 100 and .metrics.files == 100 and (.dataset.file_sha256 | test("^[0-9a-f]{64}$")) and (.model.revision | test("^[0-9a-f]{40}$")) and (.dataset.revision | test("^[0-9a-f]{40}$"))' benchmark-results/fleurs-fa-ir/summary.json >/dev/null
          jq -s -e 'length == 100 and all(.[]; (.sample_id | type == "string") and (.audio_sha256 | test("^[0-9a-f]{64}$")) and (.hypothesis | type == "string"))' benchmark-results/fleurs-fa-ir/results.jsonl >/dev/null
      - name: Attach immutable run provenance to summary
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          summary=benchmark-results/fleurs-fa-ir/summary.json
          jq --arg commit "$SOURCE_COMMIT" --arg run "$SOURCE_RUN" --arg run_id "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '. + {provenance: {source_commit: $commit, source_run: $run, source_run_id: ($run_id | tonumber), source_run_attempt: ($attempt | tonumber), generated_at: $generated_at}}' "$summary" > "$summary.tmp"
          mv "$summary.tmp" "$summary"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: persian-fleurs-cpu-benchmark
          path: benchmark-results/fleurs-fa-ir/
          if-no-files-found: warn
          retention-days: 30
